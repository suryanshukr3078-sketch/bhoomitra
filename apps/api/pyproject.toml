[project]
name = "land-governance-api"
version = "0.1.0"
description = "Backend API for the Land Governance, Research, and Policy Innovation Platform"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.119,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "geoalchemy2[shapely]>=0.18,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "email-validator>=2.2,<3.0",
    "orjson>=3.10,<4.0",
    "structlog>=25.0,<26.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "types-boto3>=1.43.92",
    "types-pyjwt>=1.7.1",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.15,<2.0",
    "coverage[toml]>=7.0,<8.0"
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "ASYNC"
]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]
branch = true
