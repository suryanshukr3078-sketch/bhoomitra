apiVersion: apps/v1
kind: Deployment
metadata:
  name: landgov-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landgov-api
  template:
    metadata:
      labels:
        app: landgov-api
    spec:
      containers:
      - name: api
        image: landgov-api:latest
        ports:
        - containerPort: 8000
